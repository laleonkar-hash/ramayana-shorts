name: Daily Ramayana Short

on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC corresponds to 09:00 AM IST
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # FFMPEG
      # =====================================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # =====================================================
      # PYTHON PACKAGES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # RUN COMPLETE PIPELINE
      # =====================================================
      - name: Create and upload Ramayana Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py

      # =====================================================
      # SAVE EPISODE STATE & GENERATED EPISODES
      # =====================================================
      - name: Save next episode
        run: |
          echo "Saving episode state..."
          cat episode_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episode_state.json ramayana_episodes.json
          if git diff --cached --quiet; then
            echo "No episode state changes to commit."
          else
            git commit -m "Update Ramayana episode state"
            git push
            echo "Episode state successfully saved to GitHub."
          fi
